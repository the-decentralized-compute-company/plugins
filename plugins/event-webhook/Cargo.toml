[package]
name = "event-webhook"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
# default-features = false keeps OpenSSL and the platform trust stores out of
# the build: rustls + webpki roots behave identically on every target a plugin
# archive is published for.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SDK is NOT published to crates.io as `tdcc-plugin`, so `tdcc-plugin = "0.72.1"`
# does not resolve. Until it is published, depend on the local checkout of the
# main TDCC repository. See README.md § Building against the SDK.
tdcc-plugin = { path = "../../../tdcc-mesh/crates/tdcc-plugin" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# A scripted TCP listener stands in for Slack in the delivery tests, so the
# retry policy is proven against a real socket rather than a mock.
tokio = { version = "1", features = ["io-util", "net"] }

# Standalone crate: this plugin is not a member of any surrounding workspace.
[workspace]
