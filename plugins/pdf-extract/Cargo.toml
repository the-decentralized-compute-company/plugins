[package]
name = "pdf-extract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
lopdf = { version = "0.44", default-features = false }

tdcc-plugin = { path = "../../../tdcc-mesh/crates/tdcc-plugin" }

[workspace]
