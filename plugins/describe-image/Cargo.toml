[package]
name = "describe-image"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

# Decoding and downscaling happen in-process, so the format list is an
# allowlist rather than `default-features`: every decoder linked here is
# attack surface reachable from a tool argument on somebody else's machine.
# These six cover what people actually hand a vision model (photos,
# screenshots, scans) and leave out the exotic ones.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }

# rustls rather than the platform TLS stack: people build this plugin on their
# own machines, and a bundled-roots rustls build needs no OpenSSL headers.
# `reqwest::Url` is re-exported `url::Url`, so there is no separate `url`
# dependency and no chance of two incompatible `Url` types.
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "http2",
    "json",
    "rustls-tls",
] }

# `tdcc-plugin` is NOT published on crates.io under this name — it was renamed
# from `mesh-llm-plugin` and its repository is private — so `tdcc-plugin = "…"`
# does not resolve. Point at a local `tdcc-mesh` checkout instead. See
# README.md > "Building against the SDK" for what to change once the SDK is
# published.
tdcc-plugin = { path = "../../../tdcc-mesh/crates/tdcc-plugin" }

# Standalone crate: this plugin is not a member of any surrounding workspace.
[workspace]
