[package]
name = "mcp-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
# The operator writes the server list as TOML, the same shape `config.toml` and
# `workload-policy.toml` already use. Parsing only — nothing here is serialized
# back out to disk.
toml = "0.9"

# Already in the graph through `rmcp`'s reqwest transport, so this costs no
# extra compilation. It is a direct dependency because deciding whether an
# upstream URL carries embedded credentials is a security check, and picking
# apart an authority by hand is the wrong way to make one.
url = "2"

# The same MCP implementation the host itself links, at the same version, so a
# bridged server talks to one protocol implementation rather than to a second
# one written here. `client` and the two client transports are the additions;
# `tdcc-plugin` already pulls in `server`.
#
# `reqwest` (rather than only `transport-streamable-http-client-reqwest`) turns
# on rustls with bundled roots, which is what makes an `https://` upstream work
# without OpenSSL headers on the contributor's machine. `which-command` resolves
# `npx` / `uvx` through `PATH` including Windows `PATHEXT` shims, which plain
# `CreateProcess` does not do.
rmcp = { version = "1.8", default-features = false, features = [
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "which-command",
] }

# `tdcc-plugin` is NOT published on crates.io under this name — it was renamed
# from `mesh-llm-plugin` and its repository is private — so `tdcc-plugin = "…"`
# does not resolve. Point at a local `tdcc-mesh` checkout instead. See
# README.md > "Building against the SDK" for what to change once the SDK is
# published.
tdcc-plugin = { path = "../../../tdcc-mesh/crates/tdcc-plugin" }

# Standalone crate: this plugin is not a member of any surrounding workspace.
[workspace]
