[package]
name = "git-tools"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# libgit2 in-process rather than a `git` subprocess. The reasoning is in
# README.md > "Why libgit2 and not the git binary"; the short version is that a
# library has no argument vector for a hostile ref name to inject into, no PATH
# lookup to hijack, and no dependency on which version of git a contributor
# happens to have installed.
#
# `default-features = false` drops the `https` and `ssh` features, so no TLS
# stack and no libssh2 are linked at all. Clone, fetch, and push are therefore
# unavailable at the library level rather than merely unused — the `status`
# tool reports `https_transport: false` and `ssh_transport: false` straight out
# of `git2::Version`, and a test asserts it.
#
# The cost of this choice is a C dependency: libgit2-sys vendors and compiles
# libgit2, so a C compiler is required to build this plugin. `sqlite-query`
# already sets that precedent in this repository.
git2 = { version = "0.20", default-features = false }

# `tdcc-plugin` is NOT published on crates.io under this name — it was renamed
# from `mesh-llm-plugin` and its repository is private — so `tdcc-plugin = "…"`
# does not resolve. Point at a local `tdcc-mesh` checkout instead. See
# README.md > "Building against the SDK" for what to change once the SDK is
# published.
tdcc-plugin = { path = "../../../tdcc-mesh/crates/tdcc-plugin" }

# Standalone crate: this plugin is not a member of any surrounding workspace.
[workspace]
