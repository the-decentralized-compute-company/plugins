[package]
name = "model-mirror"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

# `tdcc-plugin` and `model-ref` are NOT on crates.io: the SDK was renamed from
# `mesh-llm-plugin` and the `tdcc-mesh` repository is still private, so
# `tdcc-plugin = "0.72.1"` does not resolve. Both are path dependencies into a
# sibling checkout of `tdcc-mesh`. See "Building against the SDK" in README.md
# for the one-line change a public consumer makes once they are published.
tdcc-plugin = { path = "../../../tdcc-mesh/crates/tdcc-plugin" }
model-ref = { path = "../../../tdcc-mesh/crates/model-ref" }

[dev-dependencies]
tempfile = "3"

# Standalone crate: this plugin is not a member of any surrounding workspace.
[workspace]
