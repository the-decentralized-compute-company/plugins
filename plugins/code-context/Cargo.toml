[package]
name = "code-context"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
globset = "0.4"
ignore = "0.4"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The SDK is not published to crates.io under this name yet — `tdcc-plugin` was
# renamed from `mesh-llm-plugin` and its repository is private — so
# `tdcc-plugin = "0.72.1"` does not resolve. This points at a local `tdcc-mesh`
# checkout sitting next to this repository. A public consumer replaces the line
# below with the published crate once it lands. See README.md, "Building
# against the SDK".
tdcc-plugin = { path = "../../../tdcc-mesh/crates/tdcc-plugin" }

# Standalone crate: this plugin is not a member of any surrounding workspace.
[workspace]
